<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validación de reporte · HG Asfáltica DGST</title>
  <style>
    :root{--guinda:#611232;--verde:#1e5b4f;--gris:#98989a;--linea:#e4e0da;--bg:#f4f3f1;--tinta:#161a1d}
    *{box-sizing:border-box}body{margin:0;font-family:'Noto Sans','Segoe UI',Arial,sans-serif;color:var(--tinta);background:var(--bg)}
    .barra{height:6px;background:linear-gradient(90deg,var(--guinda) 0 62%,var(--verde) 62% 100%)}
    header{background:#fff;border-bottom:1px solid var(--linea);padding:14px 18px}
    header h1{margin:0;color:var(--guinda);font-size:18px}
    header p{margin:3px 0 0;color:var(--gris);font-size:12px}
    .wrap{max-width:820px;margin:16px auto;padding:0 18px}
    .badge{display:inline-block;padding:8px 14px;border-radius:8px;font-weight:800;font-size:15px;margin:6px 0 14px}
    .ok{background:#e8f2ef;color:var(--verde);border:1px solid #bfe0d6}
    .bad{background:#fbe9ec;color:var(--guinda);border:1px solid #e9c4cf}
    .na{background:#f1eee8;color:#777;border:1px solid var(--linea)}
    .card{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:14px}
    h2{font-size:14px;color:var(--verde);margin:0 0 10px;border-bottom:2px solid #e6d194;padding-bottom:6px}
    table{width:100%;border-collapse:collapse;font-size:13.5px}
    td{padding:5px 4px;border-bottom:1px solid #eceae6}td:last-child{text-align:right;font-weight:600}
    .pg{font-size:30px;font-weight:800;color:var(--guinda);text-align:center;margin:4px 0}
    .nota{font-size:12px;color:#666;line-height:1.5}
    code{background:#f1eee8;padding:1px 5px;border-radius:4px;font-size:11px;word-break:break-all}
  </style>
</head>
<body>
  <div class="barra"></div>
  <header>
    <h1>Validación de reporte</h1>
    <p>HG Asfáltica DGST · Herramienta Guía Asfáltica de la Dirección General de Servicios Técnicos · SICT</p>
  </header>
  <div class="wrap" id="cont"><p>Cargando reporte…</p></div>

  <script>
    async function sha256Hex(str){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}catch(e){return"";}}
    function b64d(s){return decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))));}
    const cont=document.getElementById("cont");
    const fila=(k,v)=>v!==undefined&&v!==""&&v!==null?`<tr><td>${k}</td><td>${v}</td></tr>`:"";
    (async()=>{
      const raw=(location.hash||"").replace(/^#/,"");
      if(!raw){cont.innerHTML='<div class="card"><span class="badge na">Sin datos</span><p class="nota">Este validador se abre desde el código QR de un reporte HG Asfáltica DGST.</p></div>';return;}
      let d;try{d=JSON.parse(b64d(raw));}catch(e){cont.innerHTML='<div class="card"><span class="badge bad">No se pudo leer el reporte</span><p class="nota">El contenido del QR no es válido.</p></div>';return;}
      let badge='<span class="badge na">Reporte sin sello</span>';
      if(d.c&&d.h){const h=await sha256Hex(d.c);badge=(h===d.h)?'<span class="badge ok">✓ SELLO VÁLIDO — el reporte no fue alterado</span>':'<span class="badge bad">✗ EL SELLO NO COINCIDE — el reporte pudo ser alterado</span>';}
      const dd=d.d||null;
      cont.innerHTML=`
        ${badge}
        <div class="card">
          <h2>Datos del reporte</h2>
          <table>
            ${fila("Número de reporte",d.r)}
            ${fila("Fecha y hora de generación",d.f)}
            ${fila("Proyecto",d.proy)}
            ${fila("Unidad responsable",d.uni)}
            ${fila("Dirigido a",d.dir)}
            ${fila("Elaboró / responsable técnico",d.resp)}
          </table>
        </div>
        <div class="card">
          <h2>Ubicación</h2>
          <table>
            ${fila("Carretera",d.car)}${fila("Tramo",d.tr)}
            ${fila("Clave PARCF / DGCC",(d.cp||"")+(d.dg?" / "+d.dg:""))}
            ${fila("Estado / Red",(d.edo||"")+(d.red?" · "+d.red:""))}
            ${fila("Coordenadas (lat, lon)",(d.lat!=null?d.lat+", "+d.lon:""))}
          </table>
        </div>
        <div class="card">
          <h2>Resultado (Grado PG)</h2>
          <div class="pg">${d.pgg||d.pg||""}</div>
          <table>
            ${fila("PG por temperatura",d.pg)}
            ${fila("∑L (Inst. Ing. UNAM)",(d.L!=null?d.L+" × 10⁶":""))}
            ${fila("Nivel de ajuste",d.niv)}
            ${fila("Velocidad · TDPA · SC",(d.vel!=null?d.vel+" km/h · "+d.tdpa+" · SC "+d.sc:""))}
          </table>
        </div>
        ${dd?`<div class="card"><h2>Diseño de mezcla y cantidades</h2><table>
            ${fila("Espesor · ancho · longitud",dd.esp+" cm · "+dd.anc+" m · "+dd.lar+" m")}
            ${fila("Tipo · método",(dd.tipo||"")+" · "+(dd.met||""))}
            ${fila("Mezcla asfáltica",dd.tonM+" t")}
            ${fila("Cemento asfáltico",dd.tonCA+" t")}
            ${fila("Material pétreo",dd.tonP+" t")}
            ${fila("∑L estructural",(dd.Lestr!=null?dd.Lestr+" × 10⁶":""))}
          </table></div>`:""}
        <div class="card">
          <h2>Integridad</h2>
          <p class="nota">Sello de integridad (SHA-256): <code>${d.h||"—"}</code><br>
          Este validador recalcula el sello con los datos del reporte incrustados en el QR y lo compara con el sello firmado. Si el PDF fue alterado, el sello no coincide.</p>
        </div>
        <p class="nota">Herramienta de referencia; el criterio del proyectista prevalece. DGST · SICT.</p>`;
    })();
  </script>
</body>
</html>
